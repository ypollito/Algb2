<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Visualizador Matemático</title>
  <style>
    body { margin: 0; overflow: hidden; background: #121212; color: white; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="info">
    <h2>Visualizador 3D</h2>
    <p>Usa el mouse para rotar y hacer zoom.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(3, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const gridHelper = new THREE.GridHelper(10, 10, 0x00ff00, 0x444444);
    scene.add(gridHelper);

    // Vector de ejemplo (Flecha roja)
    const dir = new THREE.Vector3(2, 2, 1).normalize();
    const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(0,0,0), 3, 0xff0055);
    scene.add(arrow);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
